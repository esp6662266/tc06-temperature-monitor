name: Build Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tc06-windows-installer
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Build and test self-contained installer
        shell: pwsh
        run: ./scripts/Build-Windows.ps1 -Python python -Installer
      - name: Save installer and verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tc06-windows-x64-${{ github.sha }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
