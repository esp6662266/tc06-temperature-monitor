<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TC-06 · 현장 온도</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <main>
    <header><div class="brand"><span class="mark">T</span><span>현장 온도 모니터</span></div><span id="connection" class="badge">연결 확인 중</span></header>
    <section id="monitor-panel" aria-labelledby="asset-title">
      <div class="heading"><div><span class="eyebrow">DECOATER · 온도 감시</span><h1 id="asset-title">TC-06</h1></div><span id="quality" class="badge">데이터 대기</span></div>
      <div class="temperature"><span id="temperature">—</span><span class="unit">℃</span></div>
      <p id="status" role="status">저장된 온도를 확인하고 있습니다.</p>
      <div class="metadata"><div><span>마지막 판독</span><strong id="captured">—</strong></div><div><span>서버 저장</span><strong id="received">—</strong></div><div><span>다음 음성 안내</span><strong id="countdown">꺼짐</strong></div></div>
      <div class="controls"><button id="speech-start">음성 안내 시작</button><button id="speech-stop" class="secondary" disabled>안내 중지</button><label class="volume">음량<input id="volume" aria-label="음량" type="range" min="0" max="1" value="0.8" step="0.05"></label><button id="fullscreen" class="secondary">전체 화면</button></div>
      <p id="audio-status" class="note" role="status">음성 안내 시작을 누르면 1분마다 안내합니다.</p>
      <details><summary>기록 다운로드</summary><div class="history"><label>기록 일자 (한국시간)<input id="history-day" type="date"></label><button id="download" class="secondary">CSV 다운로드</button></div><p class="note">영상에서 읽은 참고 표시값입니다. 운전·보호 판단은 기존 HMI에서 확인하세요.</p></details>
    </section>
    <footer><span>1분 간격 저장 · 한국시간 표시</span><span id="updated">아직 수신한 값이 없습니다</span></footer>
  </main>
  <audio id="audio" preload="auto"></audio>
</body>
</html>
